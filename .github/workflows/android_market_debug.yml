name: Android CI Market Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v7

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          java-package: 'jdk'
          cache: gradle

      - name: Test drawing and build Market Debug APKs
        run: bash ./gradlew :feature:draw:testMarketDebugUnitTest :app:assembleMarketDebug

      - name: Upload drawing unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Drawing Unit Test Results
          path: feature/draw/build/test-results/testMarketDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Market Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Market Debug Universal APK
          path: app/build/outputs/apk/market/debug/*universal*.apk

      - name: Delete Market Debug APKs
        run: rm -rf app/build/outputs/apk/market
